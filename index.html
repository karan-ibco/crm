<script>var APP="https://script.google.com/macros/s/AKfycbxw3ThvlIlP4a-xyg0_WZIIsgUORwzZYzpYjcyhp-8Fe1lNhpuFu83Np1H1VvRu0abHQg/exec";var q=new URLSearchParams(location.search),go=q.get('go')||location.hash.replace('#','');var f=document.getElementById('f'),sp=document.getElementById('sp');function hide(){if(sp){sp.style.opacity=0;setTimeout(function(){sp&&sp.remove();sp=null},400)}}f.onload=function(){setTimeout(hide,600)};setTimeout(hide,15000);if(!navigator.onLine){document.getElementById('off').style.display='flex'}else{f.src=APP+'?pwa=1'+(go?'#'+go:'')}addEventListener('online',function(){document.getElementById('off').style.display='none';if(!f.src)f.src=APP+'?pwa=1'});var ib=document.getElementById('ib'),dp=null,sa=matchMedia('(display-mode: standalone)').matches||navigator.standalone,ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),dis=false;try{dis=localStorage.getItem('ib_x')==='1'}catch(e){}function showIb(t,btn){if(sa||dis)return;document.getElementById('ibt').textContent=t;document.getElementById('ibb').style.display=btn?'':'none';ib.style.display='flex'}addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;showIb('Install this app',true)});document.getElementById('ibb').onclick=function(){if(dp){dp.prompt();dp.userChoice.then(function(){ib.style.display='none';dp=null})}else location.href='install.html'};document.getElementById('ibx').onclick=function(){ib.style.display='none';try{localStorage.setItem('ib_x','1')}catch(e){}};addEventListener('appinstalled',function(){ib.style.display='none'});if(ios&&!sa)setTimeout(function(){showIb('Share → Add to Home Screen',false)},4000);
